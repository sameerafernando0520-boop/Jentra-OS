name: Jentra Sales preview

on:
  pull_request:
    paths:
      - "apps/jentra_sales/**"
      - "packages/jentra_domain/**"
      - "packages/jentra_design_system/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/sales-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Analyze Sales
        working-directory: apps/jentra_sales
        run: dart analyze lib test
      - name: Test Sales and responsive layouts
        working-directory: apps/jentra_sales
        run: flutter test --no-pub --concurrency=1 -r expanded
      - name: Build web preview without private configuration
        working-directory: apps/jentra_sales
        run: flutter build web --release --no-pub --csp --no-web-resources-cdn --no-wasm-dry-run --optimization-level=1
      - name: Build development ARM64 APK
        working-directory: apps/jentra_sales
        run: flutter build apk --release --no-pub --target-platform=android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: jentra-sales-development-preview
          path: |
            apps/jentra_sales/build/web/
            apps/jentra_sales/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
