name: Jentra OS CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jentra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  SUPABASE_CLI_VERSION: 2.114.0
  NODE_VERSION: 24

jobs:
  flutter-quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies and advisories
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed apps packages

      - name: Analyze workspace
        run: flutter analyze

      - name: Test domain contracts
        working-directory: packages/jentra_domain
        run: dart test

      - name: Test design system
        working-directory: packages/jentra_design_system
        run: flutter test --no-pub -r expanded

      - name: Test platform adapters
        working-directory: packages/jentra_platform
        run: flutter test --no-pub -r expanded

      - name: Test employee app on VM
        working-directory: apps/jentra_employee
        run: flutter test --no-pub -r expanded

      - name: Test encrypted employee browser storage in Chrome
        working-directory: apps/jentra_employee
        run: flutter test --no-pub --platform chrome test/employee_storage_browser_test.dart -r expanded

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Test employee push sender, contracts, and isolated runner
        run: >-
          node --test
          supabase/functions/tests/employee_push_dispatch.test.mjs
          supabase/functions/tests/employee_push_contract.test.mjs
          supabase/functions/tests/employee_push_runner.test.mjs

      - name: Test employee Hosting preparation
        run: node --test tools/employee-web/prepare.test.mjs

  desktop-tests:
    # The approved goldens are rendered on Windows; Linux font rasterisation
    # differs, so the desktop suite runs where the goldens were made.
    name: Desktop tests and goldens (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies and advisories
        run: flutter pub get --enforce-lockfile

      - name: Test desktop shell and goldens
        working-directory: apps/jentra_desktop
        run: flutter test --no-pub -r expanded

  database:
    name: Migrations, lint, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Lint local database
        run: supabase db lint --local --level warning

      - name: Run pgTAP security suite
        run: supabase test db

      - name: Test employee push candidate with local rollback only
        # The runner forces --local and mounts only its temporary candidate
        # suite, outside default test discovery. No hosted database is used.
        run: node supabase/candidates/run-employee-push-test.mjs --run-local

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # Full-history scan (large build artifacts in early commits) exceeds 10 minutes.
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # History holds ~650 MB of build output (dist/ zips, DLLs, logs) that
      # Gitleaks re-read on every run until the 10-minute limit cancelled it.
      # Blobs over 5 MB are binaries or generated logs, not hand-written
      # config. Pull requests scan only their own commits; pushes still scan
      # the whole history, so nothing merged goes unscanned.
      - name: Scan source and history with Gitleaks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          range=()
          if [ -n "$BASE_REF" ]; then range=("--log-opts=origin/$BASE_REF..HEAD"); fi
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose \
            --max-target-megabytes=5 "${range[@]}"

  windows-release:
    name: Windows release build
    needs:
      - flutter-quality
      - desktop-tests
      - database
      - secret-scan
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve locked dependencies and advisories
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned Windows release
        working-directory: apps/jentra_desktop
        run: flutter build windows --release --no-pub

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: jentra-os-windows-unsigned
          path: apps/jentra_desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
